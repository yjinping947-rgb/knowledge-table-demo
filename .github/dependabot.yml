# .github/dependabot.yml
# 自动依赖升级 PR。对标 Next.js / Vue / Supabase 的 Dependabot 配置。
#
# 关键设计：
# 1. 周一早上 9 点（亚洲时间）开 PR，方便作者周末 review
# 2. 升级按 ecosystem 分组：next / react / zod / eslint / typescript，避免一次开 10+ PR
# 3. CI 必须先绿才能合（依赖现有 .github/workflows/ci.yml）
# 4. 自动 assign / label 让 reviewer 知道是 dep 升级而不是 feature 改动
version: 2
updates:
  # —— 生产依赖 ——
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "MiniMax/maintainers"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      framework:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      types:
        patterns:
          - "zod"
          - "typescript"
          - "@types/*"
      ai:
        patterns:
          - "openai"
    # 关键依赖走 major：require 人工 review
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # —— GitHub Actions ——
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    reviewers:
      - "MiniMax/maintainers"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
